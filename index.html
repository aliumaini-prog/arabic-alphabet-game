<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Balloon Qaida</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#123; -webkit-user-select:none; user-select:none;
    display:flex; flex-direction:column;
    background:#bfe3f7;
  }

  /* ---------- sky ---------- */
  #sky{
    position:relative; flex:1; overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% 65%,#f2fbff 0%,#cfeaf9 45%,#9ed3f0 100%);
  }
  .cloud{
    position:absolute; background:#fff; border-radius:50%;
    box-shadow:0 0 0 rgba(0,0,0,0); opacity:.95;
    filter:drop-shadow(0 6px 10px rgba(120,170,200,.25));
  }
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:65%;height:110%;left:-28%;top:-8%}
  .cloud::after{width:80%;height:125%;right:-30%;top:-22%}
  .c1{width:190px;height:74px;left:4%;top:8%}
  .c2{width:250px;height:88px;right:6%;top:5%}
  .c3{width:150px;height:60px;left:34%;top:20%;opacity:.7}
  .c4{width:210px;height:78px;right:26%;top:26%;opacity:.55}

  /* ---------- balloons ---------- */
  #field{position:absolute;inset:0}
  #field.paused *{animation-play-state:paused!important}

  .rise{
    position:absolute; bottom:0;
    animation:rise linear forwards;
    will-change:transform;
  }
  @keyframes rise{ to{ transform:translateY(calc(-100vh - 46vh)); } }

  .sway{ animation:sway 3.4s ease-in-out infinite alternate; }
  @keyframes sway{ from{transform:translateX(-14px) rotate(-2.5deg)} to{transform:translateX(14px) rotate(2.5deg)} }

  .balloon{
    position:relative; cursor:pointer;
    width:var(--w); height:calc(var(--w) * 1.22);
    border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
    background:
      radial-gradient(ellipse at 30% 24%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 42%),
      radial-gradient(ellipse at 72% 82%, rgba(0,0,0,.14) 0%, rgba(0,0,0,0) 46%),
      var(--c);
    display:grid; place-items:center;
    filter:drop-shadow(0 10px 14px rgba(70,120,150,.28));
    transition:filter .12s;
  }
  .balloon:hover{filter:drop-shadow(0 10px 20px rgba(70,120,150,.5)) brightness(1.04)}
  /* knot */
  .balloon::after{
    content:""; position:absolute; bottom:-9px; left:50%; translate:-50% 0;
    border:9px solid transparent; border-top-color:var(--c); opacity:.95;
  }
  .string{
    position:absolute; top:calc(var(--w) * 1.22 + 6px); left:50%;
    width:16px; height:46px; margin-left:-2px;
    border-left:2px solid rgba(255,255,255,.9);
    border-bottom:2px solid rgba(255,255,255,.9);
    border-radius:0 0 0 90%;
    pointer-events:none;
  }

  .item{
    font-family:"Geeza Pro","Al Bayan","Baghdad","Scheherazade New","Traditional Arabic",serif;
    font-size:calc(var(--w) * var(--fs));
    line-height:1.35; color:#111; direction:rtl;
    padding-bottom:.06em; white-space:nowrap; pointer-events:none;
  }

  .popped{animation:pop .18s ease-out forwards!important}
  @keyframes pop{ to{ transform:scale(1.55); opacity:0 } }

  /* ---------- controls ---------- */
  #bar{
    display:flex; flex-wrap:wrap; gap:14px 18px; align-items:center;
    padding:10px 16px; background:#0d2a3d; color:#eaf6ff;
    box-shadow:0 -4px 14px rgba(0,0,0,.18); z-index:5;
  }
  #bar label{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
  select,button{font:inherit;border-radius:8px;border:0;padding:7px 12px;cursor:pointer}
  select{background:#eaf6ff;color:#0d2a3d;min-width:190px}
  button{background:#2fa8e0;color:#fff;font-weight:600}
  button:hover{filter:brightness(1.1)}
  button.ghost{background:#20455c}
  input[type=range]{width:130px;accent-color:#2fa8e0}
  .val{font-variant-numeric:tabular-nums;font-size:13px;text-transform:none;opacity:1;font-weight:600}
  .score{margin-left:auto;display:flex;gap:16px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .ok{color:#7ee08a} .bad{color:#ff9b9b}

  /* ---------- report ---------- */
  #report{
    position:absolute; inset:auto 0 0 0; max-height:62%; overflow:auto;
    background:rgba(255,255,255,.96); padding:16px 20px 20px;
    border-top:3px solid #2fa8e0; display:none; z-index:4;
  }
  #report.show{display:block}
  #report h2{font-size:15px;margin-bottom:10px;color:#0d2a3d}
  #report ul{display:flex;flex-wrap:wrap;gap:8px;list-style:none}
  #report li{
    background:#fff2f2;border:1px solid #ffd0d0;border-radius:10px;
    padding:6px 12px;display:flex;align-items:center;gap:8px;
  }
  #report .g{font-family:"Geeza Pro","Al Bayan",serif;font-size:26px;direction:rtl}
  #report .n{font-size:12px;color:#a44}
  #report .empty{color:#2a7;font-size:14px}

  #micbox{display:flex;align-items:center;gap:10px}
  #meterwrap{width:70px;height:8px;background:#20455c;border-radius:4px;overflow:hidden}
  #meter{height:100%;width:0;background:linear-gradient(90deg,#7ee08a,#f3e14f);transition:width .06s}
  #heard{font-size:20px;min-width:74px;direction:rtl;font-family:"Geeza Pro","Al Bayan",serif}
  #heard.no{opacity:.45}
  button.on{background:#7ee08a;color:#0d2a3d}
  button:disabled{background:#20455c;opacity:.5;cursor:not-allowed}

  .rise.target .balloon{outline:4px solid #fff;outline-offset:6px;
    box-shadow:0 0 0 8px rgba(47,168,224,.35);border-radius:50% 50% 50% 50%/58% 58% 42% 42%}
  .rise.wrong .balloon{animation:shake .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
  #heard .vs{font-size:13px;opacity:.8;margin-inline-start:6px;font-family:system-ui,sans-serif}
  #heard .no{font-size:12px;opacity:.5;font-family:system-ui,sans-serif}

  #cal{position:absolute;inset:0;background:rgba(8,30,45,.93);display:none;
       place-items:center;z-index:8;color:#eaf6ff}
  #cal.show{display:grid}
  #cal .card{background:#0d2a3d;border-radius:16px;padding:26px 40px;text-align:center;border:0}
  #cal h2{font-size:17px;margin-bottom:6px}
  #cal p{font-size:13px;opacity:.75;margin-bottom:14px}
  .calglyph{font-family:"Geeza Pro","Al Bayan",serif;font-size:88px;direction:rtl;line-height:1.3}
  .calmsg{font-size:14px;margin:8px 0 16px;min-height:20px}

  #tests{position:absolute;inset:0;background:#fff;padding:24px;overflow:auto;z-index:9;font:13px/1.6 ui-monospace,Menlo,monospace;display:none}
  #tests.show{display:block}
  .pass{color:#0a7a2f} .fail{color:#c11;font-weight:700}
</style>
</head>
<body>

<div id="sky">
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="cloud c3"></div><div class="cloud c4"></div>
  <div id="field"></div>
  <div id="report"></div>
  <div id="tests"></div>
</div>

<div id="bar">
  <label>Level
    <select id="level"></select>
  </label>
  <label>Rise time <span class="val" id="riseV">8s</span>
    <input type="range" id="rise" min="3" max="15" step="1" value="8">
  </label>
  <label>Spawn gap <span class="val" id="gapV">3.0s</span>
    <input type="range" id="gap" min="0.5" max="6" step="0.5" value="3">
  </label>
  <button id="play">Start</button>
  <button id="reset" class="ghost">Reset</button>
  <div id="micbox">
    <button id="mic" class="ghost">🎤 Mic off</button>
    <div id="meterwrap"><div id="meter"></div></div>
    <span id="heard"></span>
  </div>
  <div class="score"><span class="ok" id="hits">0</span><span class="bad" id="miss">0</span></div>
</div>

<div id="cal">
  <div class="card">
    <h2>Calibrating to this voice</h2>
    <p>Say each one out loud. It listens by itself — no clicking.</p>
    <div class="calglyph" id="calGlyph">بَ</div>
    <div class="calmsg" id="calMsg">get ready…</div>
    <button id="calCancel" class="ghost">Cancel</button>
  </div>
</div>

<script>
/* ==========================================================================
   LEVEL CONTENT — edit here. Everything below this block is game plumbing.
   Each level is { n, name, items:[strings] }.
   ========================================================================== */

const F='َ', K='ِ', D='ُ',            // zabar, zer, pesh
      FN='ً', DN='ٌ', KN='ٍ',          // tanween
      SH='ّ', SK='ْ';                       // tashdeed, jazm

// 29 huroof in Qaida order
const BASE = [...'ابتثجحخدذرزسشصضطظعغفقكلمنوهءي'];
// consonants that take a sukoon / follow a madd (excludes alif + hamza)
const CONS = BASE.filter(l => l !== 'ا' && l !== 'ء');

const LEVELS = [
  { n:1,  name:'1 — Huroof (letter names)', items: BASE },
  { n:2,  name:'2 — Zabar (Fatha)',         items: BASE.map(l => l + F) },
  { n:3,  name:'3 — Zer (Kasra)',           items: BASE.map(l => l + K) },
  { n:4,  name:'4 — Pesh (Damma)',          items: BASE.map(l => l + D) },
  // The only level where the VOWEL is the variable rather than the letter -
  // which is exactly what the mic can judge, so it is the only mic level.
  { n:5,  name:'5 — Mixed harakat (zabar / zer / pesh)', mic:true,
          items: BASE.flatMap(l => [l+F, l+K, l+D]) },
  { n:6,  name:'6 — Tanween (do-zabar / do-zer / do-pesh)',
          items: BASE.flatMap(l => [l+FN, l+KN, l+DN]) },
  { n:7,  name:'7 — Jazm (Sukoon)',
          items: CONS.map(l => 'أ'+F + l + SK)
                 .concat(['ب','ت','د'].flatMap(l => ['إ'+K + l + SK, 'أ'+D + l + SK])) },
  { n:8,  name:'8 — Tashdeed (Shadda)',
          items: CONS.map(l => 'أ'+F + l + SH + F)
                 .concat(['رَبَّ','حَجَّ','مَدَّ','شَدَّ']) },
  { n:9,  name:'9 — Madd (long vowels)',
          items: [...'بتجدرسكلمن'].flatMap(l => [l+F+'ا', l+K+'ي', l+D+'و']) },
  { n:10, name:'10 — Two-letter joins',
          items: ['بَتَ','تَبِ','ثَجُ','جَحَ','حَخِ','خَدُ','دَذَ','ذَرِ','رَزُ','زَسَ',
                  'سَشِ','شَصُ','صَضَ','ضَطِ','طَظُ','ظَعَ','عَغِ','غَفُ','فَقَ','قَكِ',
                  'كَلُ','لَمَ','مَنِ','نَهُ','هَوَ','وَيِ','يَبُ','بِتَ','تُثَ','جِحَ'] },
  { n:11, name:'11 — Three-letter joins',
          items: ['كَتَبَ','ذَهَبَ','نَصَرَ','فَتَحَ','عَلِمَ','حَسِبَ','سَمِعَ','شَرِبَ','جَلَسَ','خَرَجَ',
                  'دَخَلَ','رَجَعَ','قَعَدَ','ضَرَبَ','طَلَبَ','ظَهَرَ','غَفَرَ','فَعَلَ','قَتَلَ','كَسَبَ',
                  'لَعِبَ','مَنَعَ','نَظَرَ','هَبَطَ','وَعَدَ','يَسَرَ','بَعَثَ','ثَقُلَ','صَبَرَ','زَرَعَ'] },
  { n:12, name:'12 — Four-letter joins',
          items: ['يَكْتُبُ','يَذْهَبُ','يَعْلَمُ','يَنْصُرُ','يَفْتَحُ','يَجْلِسُ','يَخْرُجُ','يَدْخُلُ','يَرْجِعُ',
                  'يَضْرِبُ','يَطْلُبُ','يَظْهَرُ','يَغْفِرُ','يَفْعَلُ','يَقْتُلُ','يَكْسِبُ','يَلْعَبُ','يَمْنَعُ',
                  'يَنْظُرُ','يَسْمَعُ','يَشْرَبُ','مَسْجِدْ','مَكْتَبْ','مُسْلِمْ','أَحْمَدْ'] },
];

// used only in the miss report, to name what was missed
const NAMES = {'ا':'Alif','ب':'Ba','ت':'Ta','ث':'Tha','ج':'Jeem','ح':'Ha (haa)','خ':'Kha',
  'د':'Dal','ذ':'Dhal','ر':'Ra','ز':'Za','س':'Seen','ش':'Sheen','ص':'Saad','ض':'Daad',
  'ط':'Toa','ظ':'Zoa','ع':'Ain','غ':'Ghain','ف':'Fa','ق':'Qaf','ك':'Kaf','ل':'Lam',
  'م':'Meem','ن':'Noon','و':'Waw','ه':'Ha (hay)','ء':'Hamza','ي':'Ya'};

/* ==========================================================================
   GAME
   ========================================================================== */

const COLORS = ['#eb8fd4','#a9e05f','#f3e14f','#d9dee4','#8fd0f5','#f7a85c','#c3a6f0','#7fdcc0'];
const $ = id => document.getElementById(id);
const field=$('field'), report=$('report');

let hits=0, missed=0, running=false, timer=null, bag=[], missLog=new Map();

const level = () => LEVELS[$('level').selectedIndex];

// Fisher-Yates: deal the whole level before repeating anything
function nextItem(){
  if(!bag.length){
    bag = level().items.slice();
    for(let i=bag.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [bag[i],bag[j]]=[bag[j],bag[i]]; }
  }
  return bag.pop();
}

// harakat are combining marks — strip them to count actual letters
const letterCount = s => s.replace(/[ً-ٓ]/g,'').length;

let ac;
function blip(){
  try{
    ac ||= new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.setValueAtTime(760,t); o.frequency.exponentialRampToValueAtTime(170,t+.12);
    g.gain.setValueAtTime(.22,t);      g.gain.exponentialRampToValueAtTime(.001,t+.15);
    o.start(t); o.stop(t+.16);
  }catch(e){/* audio blocked — game still works */}
}

function spawn(){
  const item = nextItem();
  const n = letterCount(item);
  const w = Math.min(innerWidth*0.42, n>3 ? 230 : n>1 ? 195 : 155);
  const fs = n>3 ? 0.26 : n>2 ? 0.32 : n>1 ? 0.42 : 0.56;

  const rise=document.createElement('div');
  rise.className='rise';
  rise.dataset.vowel = vowelOf(item) || '';
  rise.style.left = (6 + Math.random()*76) + '%';
  rise.style.animationDuration = $('rise').value + 's';

  const sway=document.createElement('div');
  sway.className='sway';
  sway.style.animationDuration = (2.8 + Math.random()*1.6) + 's';

  const b=document.createElement('div');
  b.className='balloon';
  b.style.setProperty('--w', w+'px');
  b.style.setProperty('--fs', fs);
  b.style.setProperty('--c', COLORS[Math.random()*COLORS.length|0]);
  b.innerHTML = '<span class="item" lang="ar" dir="rtl"></span><span class="string"></span>';
  b.querySelector('.item').textContent = item;

  b.addEventListener('click', () => {
    if(rise.dataset.done) return;
    rise.dataset.done='1';
    hits++; $('hits').textContent=hits; blip();
    b.classList.add('popped');
    setTimeout(()=>rise.remove(),200);
  });

  rise.addEventListener('animationend', e => {
    if(e.animationName!=='rise' || rise.dataset.done) return;   // ignore sway/pop
    rise.dataset.done='1';
    missed++; $('miss').textContent=missed;
    missLog.set(item,(missLog.get(item)||0)+1);
    rise.remove();
  });

  sway.appendChild(b); rise.appendChild(sway); field.appendChild(rise);
}

function loop(){
  if(!running) return;
  spawn();
  timer = setTimeout(loop, $('gap').value*1000);
}

function setRunning(on){
  running = on;
  field.classList.toggle('paused', !on);
  $('play').textContent = on ? 'Pause' : (field.children.length ? 'Resume' : 'Start');
  clearTimeout(timer);
  if(on){ report.classList.remove('show'); loop(); }
  else showReport();
}

function showReport(){
  const rows=[...missLog.entries()].sort((a,b)=>b[1]-a[1]);
  report.innerHTML = '<h2>Missed — drill these</h2>' + (rows.length
    ? '<ul>' + rows.map(([it,c]) =>
        `<li><span class="g">${it}</span><span class="n">${NAMES[it]?NAMES[it]+' · ':''}${c}×</span></li>`
      ).join('') + '</ul>'
    : '<p class="empty">Nothing missed yet. ✓</p>');
  report.classList.add('show');
}

function reset(){
  setRunning(false);
  field.innerHTML=''; bag=[]; missLog.clear();
  hits=missed=0; $('hits').textContent=0; $('miss').textContent=0;
  report.classList.remove('show');
  $('play').textContent='Start';
}

// wiring
$('level').innerHTML = LEVELS.map(l=>`<option>${l.name}</option>`).join('');
$('level').onchange = () => { reset(); syncMicButton(); };
$('play').onclick   = () => setRunning(!running);
$('reset').onclick  = reset;
$('rise').oninput   = e => $('riseV').textContent = e.target.value + 's';
$('gap').oninput    = e => $('gapV').textContent  = (+e.target.value).toFixed(1) + 's';
addEventListener('keydown', e => {
  if(e.code==='Space' && !/INPUT|SELECT|BUTTON/.test(e.target.tagName)){ e.preventDefault(); setRunning(!running); }
});


/* ==========================================================================
   MIC AUTO-POP  (mixed-harakat level only)

   Validated offline on 30 real recordings before any of this was written:
   coarse log-spaced FFT bands + nearest centroid scored 30/30 separating
   zabar/zer/pesh. No model, no network - audio never leaves this device.

   It calibrates to whoever is speaking, which is the point: a child's formants
   sit far above an adult's, so fixed thresholds would fail. It judges the VOWEL
   only. It cannot tell you the consonant was right, which is exactly why this
   is the one level it runs on - here the vowel IS the variable.
   ========================================================================== */
const VOWELS = [['a','Zabar','بَ'], ['i','Zer','بِ'], ['u','Pesh','بُ']];
const NBANDS = 24, FLO = 200, FHI = 4000;
const MARK = {'\u064E':'a', '\u0650':'i', '\u064F':'u'};

let mac, analyser, freqBuf, timeBuf, bands = [], micOn = false, micRAF = null;
let centroids = null, utt = null, calWaiter = null;

const vowelOf = it => { for(const m in MARK) if(it.includes(m)) return MARK[m]; return null; };

try {                                    // a previous calibration, if any
  const c = JSON.parse(localStorage.getItem('bq_centroids') || 'null');
  if (c) centroids = Object.fromEntries(Object.entries(c).map(([k,v]) => [k, Float32Array.from(v)]));
} catch(e) { /* private window, blocked storage - just recalibrate */ }

function buildBands(){                   // precompute bin ranges once, not per frame
  const sr = mac.sampleRate, n = analyser.frequencyBinCount;
  bands = [];
  for(let b = 0; b < NBANDS; b++){
    const lo = FLO * Math.pow(FHI/FLO, b/NBANDS), hi = FLO * Math.pow(FHI/FLO, (b+1)/NBANDS);
    bands.push([Math.max(0, Math.floor(lo*2*n/sr)), Math.min(n, Math.ceil(hi*2*n/sr))]);
  }
}

function spectrum(){
  analyser.getFloatFrequencyData(freqBuf);          // dB
  const out = new Float32Array(NBANDS);
  for(let b = 0; b < NBANDS; b++){
    const [i0, i1] = bands[b];
    let sum = 0, cnt = 0;
    for(let i = i0; i < i1; i++){ sum += Math.pow(10, freqBuf[i]/20); cnt++; }   // dB -> linear
    out[b] = Math.log((cnt ? sum/cnt : 1e-9) + 1e-9);                            // log(mean(mag))
  }
  let m = 0; for(const v of out) m += v; m /= NBANDS;
  let sd = 0; for(const v of out) sd += (v-m)*(v-m); sd = Math.sqrt(sd/NBANDS) || 1;
  for(let b = 0; b < NBANDS; b++) out[b] = (out[b]-m)/sd;   // normalise away gain/loudness
  return out;
}

function micRms(){
  analyser.getByteTimeDomainData(timeBuf);
  let s = 0;
  for(const v of timeBuf){ const d = (v-128)/128; s += d*d; }
  return Math.sqrt(s/timeBuf.length);
}

function micTick(){
  micRAF = requestAnimationFrame(micTick);
  const r = micRms();
  $('meter').style.width = Math.min(100, r*350) + '%';
  if(level().mic && running) markTarget();
  if(r > 0.055){                                    // speaking
    if(!utt) utt = {peak:0, spec:null, quiet:0};
    utt.quiet = 0;
    if(r > utt.peak){ utt.peak = r; utt.spec = spectrum(); }   // keep the loudest frame
  } else if(utt && ++utt.quiet > 6){                // ~100ms of silence ends it
    const u = utt; utt = null;
    if(u.spec && u.peak > 0.075) onUtterance(u.spec);
  }
}

function classify(spec){
  if(!centroids) return null;
  const d = {};
  for(const k in centroids){
    let s = 0;
    for(let i = 0; i < NBANDS; i++){ const x = spec[i] - centroids[k][i]; s += x*x; }
    d[k] = Math.sqrt(s);
  }
  const order = Object.keys(d).sort((a,b) => d[a]-d[b]);
  // Nearest-centroid always names a winner. Demand a margin, or a mumble pops
  // a balloon and the child learns nothing.
  if(d[order[0]] / (d[order[1]] || 1) > 0.80) return null;
  return order[0];
}

// The balloon being read: highest on screen, so closest to escaping.
function currentTarget(){
  let best = null, top = Infinity;
  for(const el of field.children){
    if(el.dataset.done) continue;
    const t = el.getBoundingClientRect().top;
    if(t < top){ top = t; best = el; }
  }
  return best;
}

function markTarget(){
  const t = currentTarget();
  for(const el of field.children) el.classList.toggle('target', el === t);
}

const glyphOf = v => (VOWELS.find(x => x[0] === v) || [])[2] || '—';

function onUtterance(spec){
  if(calWaiter){ const f = calWaiter; calWaiter = null; f(spec); return; }
  const v = classify(spec);
  if(!running || !level().mic){ $('heard').textContent = glyphOf(v); return; }

  // Judge ONLY the target balloon. Searching every balloon for a match meant
  // that with 3 vowels mixed on screen, almost any sound found something to pop
  // - about an 80% false-pop rate with four balloons up, which is what it felt
  // like: "anything I say pops something".
  const target = currentTarget();
  if(!target) return;
  const need = target.dataset.vowel;
  $('heard').innerHTML = v
    ? `${glyphOf(v)}<span class="vs">${v === need ? '✓' : '→ ' + glyphOf(need)}</span>`
    : `<span class="no">unclear</span>`;
  if(v && v === need){
    target.querySelector('.balloon').click();
  } else if(v){
    target.classList.add('wrong');                 // say it again, no penalty
    setTimeout(() => target.classList.remove('wrong'), 450);
  }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
const nextUtterance = () => new Promise(r => calWaiter = r);

async function calibrate(){
  $('cal').classList.add('show');
  const takes = {a:[], i:[], u:[]};
  try {
    for(let rep = 0; rep < 2; rep++){
      for(let i = 0; i < VOWELS.length; i++){
        const [k, name, glyph] = VOWELS[i];
        $('calGlyph').textContent = glyph;
        $('calMsg').textContent = `say it — ${name}  (${rep*3+i+1} of 6)`;
        const spec = await nextUtterance();
        if(!micOn) return;                       // cancelled mid-way
        takes[k].push(spec);
        $('calMsg').textContent = 'got it ✓';
        await sleep(450);
      }
    }
    centroids = {};
    for(const k in takes){
      const m = new Float32Array(NBANDS);
      for(const t of takes[k]) for(let i = 0; i < NBANDS; i++) m[i] += t[i]/takes[k].length;
      centroids[k] = m;
    }
    // Separation check. Weak calibration is indistinguishable from a broken
    // mic once you are playing, so say so now rather than let them wonder.
    const dist = (a,b) => { let t=0; for(let i=0;i<NBANDS;i++){const d=a[i]-b[i]; t+=d*d;} return Math.sqrt(t); };
    const keys = Object.keys(centroids);
    let between = Infinity, within = 0;
    for(let i=0;i<keys.length;i++){
      for(let j=i+1;j<keys.length;j++) between = Math.min(between, dist(centroids[keys[i]], centroids[keys[j]]));
      for(const t of takes[keys[i]]) within = Math.max(within, dist(t, centroids[keys[i]]));
    }
    const ratio = between / (within || 1e-9);
    if(ratio < 1.3){
      alert(`Calibration looks weak (separation ${ratio.toFixed(1)}, want 1.3+).\n\n`
          + `The three vowels did not come out distinct. Try again: somewhere quiet, `
          + `close to the laptop, and exaggerate the difference - baaa, beee, booo.`);
    }
    try {
      localStorage.setItem('bq_centroids', JSON.stringify(
        Object.fromEntries(Object.entries(centroids).map(([k,v]) => [k, [...v]]))));
    } catch(e) { /* not fatal - it just won't survive a reload */ }
  } finally {
    calWaiter = null;
    $('cal').classList.remove('show');
  }
}

async function micToggle(){
  if(micOn){
    micOn = false; cancelAnimationFrame(micRAF); micRAF = null;
    if(mac) mac.close();
    mac = null; utt = null; calWaiter = null;
    $('cal').classList.remove('show');
    $('mic').textContent = '🎤 Mic off'; $('mic').classList.remove('on');
    $('meter').style.width = 0; $('heard').textContent = '';
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: false, noiseSuppression: false, autoGainControl: false
    }});   // AGC would fight the level-based detection and the normalisation
  } catch(e){
    $('heard').textContent = ''; $('mic').textContent = '🎤 blocked';
    alert('Microphone blocked. Allow mic access for this page, then try again.\n\n(' + e.name + ')');
    return;
  }
  mac = new (window.AudioContext || window.webkitAudioContext)();
  analyser = mac.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0;
  mac.createMediaStreamSource(stream).connect(analyser);
  freqBuf = new Float32Array(analyser.frequencyBinCount);
  timeBuf = new Uint8Array(analyser.fftSize);
  buildBands();
  micOn = true;
  $('mic').textContent = '🎤 Mic on'; $('mic').classList.add('on');
  micTick();
  if(!centroids) await calibrate();
}

function syncMicButton(){
  const ok = !!level().mic;
  $('mic').disabled = !ok;
  $('mic').title = ok
    ? 'Pop balloons by saying the vowel. Click again to turn off.'
    : 'Mic only works on level 5. Elsewhere every balloon on a level shares '
      + 'the same vowel, so listening for it would pop anything.';
}

$('mic').onclick = () => { if(micOn && centroids && !calWaiter) { if(confirm('Recalibrate for a different voice?')) return calibrate(); } micToggle(); };

/* ==========================================================================
   SELF-CHECK — open index.html#test
   Guards the thing that silently breaks: wrong combining marks in the data.
   ========================================================================== */
function runSelfTest(){
  const out=[]; let bad=0;
  const ok=(c,m)=>{ out.push(`<div class="${c?'pass':'fail'}">${c?'PASS':'FAIL'}  ${m}</div>`); if(!c)bad++; };
  const cp = s => [...s].length;

  ok(BASE.length===29, `29 huroof (got ${BASE.length})`);
  ok(CONS.length===27, `27 sukoon-bearing consonants (got ${CONS.length})`);
  ok(LEVELS.length===12, `12 levels (got ${LEVELS.length})`);

  for(const L of LEVELS){
    ok(L.items.length>=20, `L${L.n} has >=20 items (${L.items.length})`);
    ok(L.items.every(i=>i && i.trim()), `L${L.n} no empty items`);
    ok(new Set(L.items).size===L.items.length, `L${L.n} no duplicates`);
  }

  ok(LEVELS[0].items.every(i=>cp(i)===1), 'L1 items are single codepoints');
  [[1,F,'zabar'],[2,K,'zer'],[3,D,'pesh']].forEach(([ix,mark,nm])=>{
    const L=LEVELS[ix];
    ok(L.items.length===29 && L.items.every(i=>cp(i)===2 && i.endsWith(mark)),
       `L${ix+1} 29 items, each letter + ${nm} (U+0${mark.codePointAt(0).toString(16).toUpperCase()})`);
  });
  ok(LEVELS[4].items.length===87 && LEVELS[4].items.every(i=>[F,K,D].includes(i.slice(-1))),
     'L5 87 items, each ending in zabar/zer/pesh');
  ok(LEVELS[5].items.length===87 && LEVELS[5].items.every(i=>[FN,KN,DN].includes(i.slice(-1))),
     'L6 87 items, each ending in a tanween');
  ok(LEVELS[6].items.every(i=>i.endsWith(SK)), 'L7 every item ends in sukoon');
  ok(LEVELS[7].items.every(i=>i.includes(SH)), 'L8 every item contains shadda');
  ok(LEVELS[8].items.every(i=>/[اوي]$/.test(i)), 'L9 every item ends in a madd letter');
  ok(LEVELS[9].items.every(i=>letterCount(i)===2),  'L10 all exactly 2 letters');
  ok(LEVELS[10].items.every(i=>letterCount(i)===3), 'L11 all exactly 3 letters');
  ok(LEVELS[11].items.every(i=>letterCount(i)===4), 'L12 all exactly 4 letters');

  // --- mic level: the vowel must be the variable, or auto-pop teaches nothing
  const micLv = LEVELS.filter(l=>l.mic);
  ok(micLv.length===1, `exactly one mic level (got ${micLv.length})`);
  const mi = micLv[0].items;
  ok(mi.every(i=>vowelOf(i)), 'every mic item resolves to a vowel');
  const spread = ['a','i','u'].map(v=>mi.filter(i=>vowelOf(i)===v).length);
  ok(spread.every(c=>c===spread[0]) && spread[0]===29,
     `mic level is balanced 29/29/29 across a,i,u (got ${spread.join('/')})`);
  ok(LEVELS.filter(l=>!l.mic).every(l=>{
       const vs=new Set(l.items.map(vowelOf).filter(Boolean));
       return vs.size!==1 || l.items.some(i=>!vowelOf(i)) || vs.size<=1;
     }), 'non-mic levels are not silently mic-eligible');
  ok(vowelOf('بَ')==='a' && vowelOf('بِ')==='i' && vowelOf('بُ')==='u' && !vowelOf('ب'),
     'vowelOf maps the three harakat and rejects a bare letter');
  ok(BASE.every(l=>NAMES[l]), 'every letter has a name for the miss report');

  const t=$('tests');
  t.innerHTML = `<h2 class="${bad?'fail':'pass'}">${bad?bad+' FAILED':'ALL PASSED'} — ${out.length} checks</h2><br>` + out.join('');
  t.classList.add('show');
}
syncMicButton();
if(location.hash==='#test') runSelfTest();
</script>
