<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qaidah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Amiri: the Naskh cut by Bulaq Press, Cairo (مصر) — the Misri face. Amiri Quran is
     the same design tuned for vowelled Quranic text; used for the large display text. -->
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
  /* One knob for the whole UI. The classroom runs on a 75-inch touch panel viewed from
     about three metres, where a 14px banner is roughly 6mm tall. Every fixed size and
     every clamp ceiling below is multiplied by this. */
  :root{--ui:1}
  body[data-ui="large"]{--ui:1.35}
  body[data-ui="panel"]{--ui:1.9}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font:calc(15px * var(--ui))/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#123;
       -webkit-user-select:none;user-select:none;display:flex;flex-direction:column;background:#bfe3f7}
  .ar{font-family:"Amiri","Geeza Pro","Al Bayan","Scheherazade New",serif;direction:rtl}
  .item,.big,.step,.chip{font-family:"Amiri Quran","Amiri","Geeza Pro",serif}
  .red{color:#d21f1f}

  /* ---------- stage ---------- */
  /* Column layout, so the instruction banner can wrap to any number of lines on a
     narrow screen without a magic offset having to be kept in sync. */
  #stage{display:flex;flex-direction:column;flex:1;overflow:hidden;
    background:radial-gradient(120% 80% at 50% 65%,#f2fbff 0%,#cfeaf9 45%,#9ed3f0 100%)}
  #arena{position:relative;flex:1;overflow:hidden}
  .cloud{position:absolute;background:#fff;border-radius:50%;opacity:.95;
    filter:drop-shadow(0 6px 10px rgba(120,170,200,.25))}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:65%;height:110%;left:-28%;top:-8%}
  .cloud::after{width:80%;height:125%;right:-30%;top:-22%}
  .c1{width:190px;height:74px;left:4%;top:7%}
  .c2{width:250px;height:88px;right:6%;top:4%}
  .c3{width:150px;height:60px;left:34%;top:19%;opacity:.7}
  #howto{flex:0 0 auto;z-index:6;padding:10px 18px;text-align:center;
    background:rgba(255,255,255,.88);border-bottom:1px solid #dceaf3;font-size:calc(14px * var(--ui));
    line-height:1.45;color:#1a3547}
  #howto b{color:#0d2a3d}
  #howto .ar{font-size:1.25em;line-height:1;unicode-bidi:isolate}
  #turn{flex:0 0 auto;text-align:center;padding:calc(7px * var(--ui));font-weight:800;
    font-size:calc(17px * var(--ui));color:#fff;letter-spacing:.02em}
  #howto .no{color:#d21f1f;font-weight:700}
  .pane{position:absolute;inset:0;display:none}
  .pane.on{display:block}

  /* ---------- balloons ---------- */
  #field.paused *{animation-play-state:paused!important}
  .rise{position:absolute;bottom:0;animation:rise linear forwards;will-change:transform}
  @keyframes rise{ to{ transform:translateY(calc(-100vh - 46vh)) } }
  .sway{animation:sway 3.4s ease-in-out infinite alternate}
  @keyframes sway{from{transform:translateX(-14px) rotate(-2.5deg)}to{transform:translateX(14px) rotate(2.5deg)}}
  .balloon{position:relative;cursor:pointer;width:var(--w);height:calc(var(--w)*1.22);
    border-radius:50% 50% 50% 50%/58% 58% 42% 42%;display:grid;place-items:center;
    background:radial-gradient(ellipse at 30% 24%,rgba(255,255,255,.85) 0%,rgba(255,255,255,0) 42%),
               radial-gradient(ellipse at 72% 82%,rgba(0,0,0,.14) 0%,rgba(0,0,0,0) 46%),var(--c);
    filter:drop-shadow(0 10px 14px rgba(70,120,150,.28));transition:filter .12s}
  .balloon:hover{filter:drop-shadow(0 10px 20px rgba(70,120,150,.5)) brightness(1.04)}
  .balloon::after{content:"";position:absolute;bottom:-9px;left:50%;translate:-50% 0;
    border:9px solid transparent;border-top-color:var(--c);opacity:.95}
  .string{position:absolute;top:calc(var(--w)*1.22 + 6px);left:50%;width:16px;height:46px;
    margin-left:-2px;border-left:2px solid rgba(255,255,255,.9);
    border-bottom:2px solid rgba(255,255,255,.9);border-radius:0 0 0 90%;pointer-events:none}
  .item{font-size:calc(var(--w)*var(--fs));line-height:1.35;color:#111;
        padding-bottom:.06em;white-space:nowrap;pointer-events:none}
  /* Two beats beside a madd balloon, filling in turn as it rises. Ali counts 1-2 aloud
     with the children, so this paces that count. It judges nothing. */
  .beats{position:absolute;bottom:-8%;left:50%;translate:-50% 0;display:flex;gap:calc(7px * var(--ui))}
  .beats i{width:calc(11px * var(--ui));height:calc(11px * var(--ui));border-radius:50%;
    background:rgba(255,255,255,.55);box-shadow:0 0 0 2px rgba(13,42,61,.18)}
  .beats i:nth-child(1){animation:beat var(--rise) linear forwards}
  .beats i:nth-child(2){animation:beat var(--rise) linear forwards;animation-delay:calc(var(--rise) / 2)}
  @keyframes beat{0%{background:rgba(255,255,255,.55)}1%,100%{background:#f3e14f}}
  .heavy{position:absolute;top:8%;left:50%;translate:-50% 0;font-size:calc(13px * var(--ui));font-weight:700;
    color:#b4530a;background:#fff5e6;border-radius:8px;padding:1px 7px;pointer-events:none}
  .popped{animation:pop .18s ease-out forwards!important}
  @keyframes pop{ to{ transform:scale(1.55);opacity:0 } }

  /* ---------- form match ---------- */
  .card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:safe center;gap:12px;padding:14px;text-align:center;overflow-y:auto}
  .q{font-size:calc(15px * var(--ui));color:#28536b;font-weight:600}
  .big{font-size:clamp(70px,17vw,calc(150px * var(--ui)));line-height:1.45;color:#123}
  .opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .opt{min-width:clamp(96px,10vw,calc(126px * var(--ui)));min-height:2.6em;padding:2px 20px;
    border:3px solid #cfe3ef;border-radius:18px;background:#fff;cursor:pointer;
    font-size:clamp(44px,5.6vw,calc(60px * var(--ui)));line-height:1.2;display:grid;place-items:center;
    transition:.12s}
  .opt.lat{font-size:calc(21px * var(--ui));font-family:inherit;direction:ltr;
    min-height:3.4em;line-height:1.4}

  .opt:hover{border-color:#2fa8e0}
  .opt.good{border-color:#2fa04a;background:#e9f9ec}
  .opt.bad{border-color:#d21f1f;background:#fdecec;opacity:.6}

  /* ---------- join ---------- */
  .steps{display:flex;gap:clamp(10px,4vw,44px);align-items:center;justify-content:center;flex-wrap:wrap}
  .step{font-size:max(44px,min(11vw,15vh,calc(104px * var(--ui))));color:#c9d8e2;transition:color .25s,transform .25s;
        min-height:1.3em;line-height:1.45;padding-bottom:.34em}
  .step.shown{color:#123}
  /* Green is what the student got right. Red is reserved for a wrong tap - using it
     for correct progress read as an error. */
  .step.faded{color:#1c8f4b}
  .step.final{color:#1c8f4b}
  .tx-ok{color:#1c8f4b}
  .grp{display:inline-block;padding:0 .12em;border-bottom:4px solid #2fa8e0;margin:0 .12em}
  /* The chip row is Arabic: the first letter must sit on the RIGHT. Setting rtl on
     each chip only affects its contents - the row's own direction is what orders them. */
  #jactions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;direction:rtl}
  #jactions.ltr{direction:ltr}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .cap{font-size:calc(11px * var(--ui));letter-spacing:.05em;text-transform:uppercase;color:#8aa4b5;margin-top:4px}
  .cell.on .cap{color:#28536b}
  .arrow{font-size:calc(30px * var(--ui));color:#8aa4b5;align-self:center}
  .waiting{color:#c9d8e2}
  /* The lift that used to live here was derived from BARE letters and pushed the
     harakat on مَنْ / بًا clean out of the top of the box. Working it through: with the
     line box centred, the baseline lands at H/2 + (ascent-descent)/2 whatever the
     line-height, so the only real fix is a box tall enough for the ink. Sizing in em
     makes that hold for Amiri (ascent 1.83em) and the Geeza fallback (1.12em) alike. */
  .gl{display:block}
  .chip{min-width:clamp(74px,8.5vw,calc(108px * var(--ui)));min-height:2.6em;
    font-size:clamp(38px,5vw,calc(58px * var(--ui)));line-height:1.2;padding:2px 18px;
    border:3px solid #cfe3ef;border-radius:16px;
    background:#fff;cursor:pointer;display:grid;place-items:center;transition:.12s}
  .chip:hover{border-color:#2fa8e0}
  .chip.good{border-color:#2fa04a;background:#e9f9ec}
  .chip.bad{border-color:#d21f1f;background:#fdecec;opacity:.55}
  .chip.used{opacity:.32;border-color:#cfe3ef;cursor:default}
  .chip.next{border-color:#2fa8e0;box-shadow:0 0 0 5px rgba(47,168,224,.22)}
  .chip.wrong{animation:wrongflash .5s}
  @keyframes wrongflash{
    0%  {transform:translateX(0);   border-color:#d21f1f;background:#fdecec}
    25% {transform:translateX(-7px);border-color:#d21f1f;background:#fdecec}
    75% {transform:translateX(7px); border-color:#d21f1f;background:#fdecec}
    100%{transform:translateX(0);   border-color:#cfe3ef;background:#fff}}

  /* ---------- bar ---------- */
  #bar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;padding:9px 14px;
    background:#0d2a3d;color:#eaf6ff;box-shadow:0 -4px 14px rgba(0,0,0,.18);z-index:5}
  #bar label{display:flex;flex-direction:column;gap:3px;font-size:calc(10px * var(--ui));letter-spacing:.04em;
    text-transform:uppercase;opacity:.85}
  select,button,input[type=text]{font:inherit;border-radius:8px;border:0;padding:7px 11px;cursor:pointer}
  input[type=text]{cursor:text;width:120px}
  select{background:#eaf6ff;color:#0d2a3d;max-width:260px}
  button{background:#2fa8e0;color:#fff;font-weight:600}
  button:hover{filter:brightness(1.1)}
  button.ghost{background:#20455c}
  input[type=range]{width:112px;accent-color:#2fa8e0}
  .val{font-variant-numeric:tabular-nums;font-size:calc(13px * var(--ui));text-transform:none;font-weight:600;opacity:1}
  .page{background:#f3e14f;color:#0d2a3d;border-radius:8px;padding:4px 9px;font-weight:700;font-size:calc(12px * var(--ui))}
  .teach{flex-basis:100%;font-size:calc(12px * var(--ui));opacity:.75;margin-top:-4px}
  #teams{display:flex;gap:calc(10px * var(--ui));align-items:center;margin-left:auto}
  #teams .t{display:flex;align-items:center;gap:calc(7px * var(--ui));padding:calc(5px * var(--ui)) calc(12px * var(--ui));
    border-radius:10px;background:#20455c;font-weight:700;font-size:calc(15px * var(--ui));opacity:.5;
    transition:.15s;border:2px solid transparent}
  #teams .t.up{opacity:1;border-color:#f3e14f;background:#2a5a76}
  #teams .dot{width:calc(13px * var(--ui));height:calc(13px * var(--ui));border-radius:50%}
  #teams .n{font-variant-numeric:tabular-nums}
  .score{display:flex;gap:14px;font-size:calc(21px * var(--ui));font-weight:700;
    font-variant-numeric:tabular-nums}
  .ok{color:#7ee08a} .bad{color:#ff9b9b}

  /* ---------- report ---------- */
  #report{position:absolute;inset:auto 0 0 0;max-height:64%;overflow:auto;background:rgba(255,255,255,.97);
    padding:14px 18px 18px;border-top:3px solid #2fa8e0;display:none;z-index:4}
  #report.show{display:block}
  #report h2{font-size:calc(14px * var(--ui));margin-bottom:4px;color:#0d2a3d}
  #report h3{font-size:calc(12px * var(--ui));margin:12px 0 6px;color:#28536b}
  #report ul{display:flex;flex-wrap:wrap;gap:7px;list-style:none}
  #report li{background:#fff2f2;border:1px solid #ffd0d0;border-radius:9px;padding:5px 10px;
    display:flex;align-items:center;gap:7px}
  #report .g{font-size:calc(32px * var(--ui))}
  #report .n{font-size:calc(11px * var(--ui));color:#a44}
  #report .empty{color:#2a7;font-size:calc(13px * var(--ui))}

  #tests{position:absolute;inset:0;background:#fff;padding:22px;overflow:auto;z-index:9;
    font:13px/1.6 ui-monospace,Menlo,monospace;display:none}
  #tests.show{display:block}
  .pass{color:#0a7a2f} .fail{color:#c11;font-weight:700}
</style>
</head>
<body>

<div id="stage">
  <div id="howto"></div>
  <div id="turn" hidden></div>
  <div id="arena">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>

  <div class="pane on" id="pBalloon"><div id="field" style="position:absolute;inset:0"></div></div>

  <div class="pane" id="pForm">
    <div class="card">
      <div class="q" id="fq">—</div>
      <div class="big ar" id="fshow">—</div>
      <div class="opts" id="fopts"></div>
    </div>
  </div>

  <div class="pane" id="pJoin">
    <div class="card">
      <div class="steps ar" id="jsteps"></div>
      <div class="q" id="jhint" style="opacity:.75"></div>
      <div id="jactions"></div>
    </div>
  </div>

  <div id="report"></div>
  <div id="tests"></div>
  </div>
</div>

<div id="bar">
  <label>Playing
    <select id="mode">
      <option value="solo">One student</option>
      <option value="teams2">2 teams</option>
      <option value="teams3">3 teams</option>
      <option value="teams4">4 teams</option>
    </select>
  </label>
  <label id="lWho">Student
    <input type="text" id="who" placeholder="name" maxlength="16">
  </label>
  <label>Room size
    <select id="uiScale">
      <option value="1">Normal</option>
      <option value="large">Large</option>
      <option value="panel">Panel (75")</option>
    </select>
  </label>
  <label>Lesson &amp; level
    <select id="level"></select>
  </label>
  <span class="page" id="page">p—</span>
  <label id="lRise">Rise <span class="val" id="riseV">8s</span>
    <input type="range" id="rise" min="3" max="20" step="1" value="8">
  </label>
  <label id="lGap">Gap <span class="val" id="gapV">3.0s</span>
    <input type="range" id="gap" min="0.5" max="8" step="0.5" value="3">
  </label>
  <button id="play">Start</button>
  <button id="reset" class="ghost">Reset</button>
  <button id="rep" class="ghost">Report</button>
  <div id="teams"></div>
  <div class="score"><span class="ok" id="hits">0</span><span class="bad" id="miss">0</span></div>
  <div class="teach" id="teach"></div>
</div>

<script>
/* ==========================================================================
   CONTENT — transcribed from Qaidah (تعليم القرآن، الجزء الاول), pages 1-35.
   Nothing here is invented. Each block names its book page.
   To edit content you only need this block; the engine is below it.
   ========================================================================== */

const F = '\u064E', K = '\u0650', D = '\u064F';        // zabar, zer, pesh
const ZWJ = '\u200D';                                   // forces a joining form

// p1 - الحروف المفردة. 28 letters: no standalone hamza, and ى (not ي) last.
const LETTERS = ["ا", "ب", "ت", "ث", "ج", "ح", "خ", "د", "ذ", "ر", "ز", "س", "ش", "ص", "ض", "ط", "ظ", "ع", "غ", "ف", "ق", "ك", "ل", "م", "ن", "و", "ه", "ى"];
const NAMES   = ["Alif", "Baa", "Taa", "Thaa", "Jeem", "Haa (حاء)", "Khaa", "Daal", "Dhaal", "Raa", "Zaay", "Seen", "Sheen", "Saad", "Daad", "Toa", "Zoa", "Ain", "Ghain", "Faa", "Qaaf", "Kaaf", "Laam", "Meem", "Noon", "Waaw", "Haa (هاء)", "Yaa"];
const AR_NAMES= ["الف", "باء", "تاء", "ثاء", "جيم", "حاء", "خاء", "دال", "ذال", "راء", "زاي", "سين", "شين", "صاد", "ضاد", "طاء", "ظاء", "عين", "غين", "فاء", "قاف", "كاف", "لام", "ميم", "نون", "واو", "هاء", "ياء"];

// p20/25/30 - letters marked (*) are مفخم (جاڑو), read heavy
const HEAVY = ["خ", "ر", "ص", "ض", "ط", "ظ", "غ", "ق"];
// p17-18 - حروف القطع: join to the letter BEFORE, never the one AFTER
const QAT   = ["ا", "د", "ذ", "ر", "ز", "و"];

// p6-10 - بے حرفي: [letter, letter-at-start, letter-at-end]
const PAIRS = [["ب", "به", "هب"], ["ت", "تم", "بت"], ["ث", "ثم", "بث"], ["ج", "جن", "حج"], ["ح", "حب", "شح"], ["خ", "خل", "مخ"], ["س", "سب", "حس"], ["ش", "شك", "هش"], ["ص", "صن", "نص"], ["ض", "ضم", "مض"], ["ط", "طل", "قط"], ["ظ", "ظن", "حظ"], ["ع", "عش", "مع"], ["غ", "غب", "كغ"], ["ف", "فى", "عف"], ["ق", "قل", "شق"], ["ك", "كم", "يك"], ["ل", "له", "كل"], ["م", "من", "ضم"], ["ن", "نم", "عن"], ["ه", "هم", "طه"], ["ى", "يم", "بى"]];

// p11-16 - تين حرفي: [letter, شروع ما, وسط ما, اخر ما]
const W3 = [["ب", "بيت", "ثبت", "شعب"], ["ت", "تين", "ختم", "بنت"], ["ث", "ثبت", "مثل", "حيث"], ["ج", "جمل", "عجل", "ثلج"], ["ح", "حبط", "لحم", "ملح"], ["خ", "خطب", "بخل", "نفخ"], ["س", "سبت", "عسل", "ليس"], ["ش", "شطب", "مشى", "محش"], ["ص", "صحف", "بصل", "قصص"], ["ض", "ضلع", "غضب", "بعض"], ["ط", "طفل", "حطة", "مشط"], ["ظ", "ظلم", "عظم", "حفظ"], ["ع", "علم", "لعن", "تبع"], ["غ", "غيب", "شغب", "بلغ"], ["ف", "فلم", "نفس", "ملف"], ["ق", "قلب", "نقص", "خلق"], ["ك", "كتب", "بكم", "فلك"], ["ل", "لهم", "كلم", "فضل"], ["م", "منك", "عمل", "كتم"], ["ن", "نحن", "كنت", "بين"], ["ه", "همل", "مهل", "سفه"], ["ى", "يلج", "بيت", "بغى"]];

// p17-18 - words showing where the قطع letters break the join
const QAT_WORDS = ["كان", "دين", "حمد", "حدث", "ذلك", "ريب", "نظر", "رطب", "مرض", "غير", "وطد", "يوم", "فوم", "فهو", "دثر", "ثرد", "طرد", "حرد", "دون", "زاد"];

// p21-24 - زبر تمرين. Every harakat in these is fatha.
const ZABAR = ["أَخَذَ", "مَثَلَ", "جَمَعَ", "رَجَعَ", "ضَرَبَ", "كَشَفَ", "نَظَرَ", "عَزَمَ", "صَبَرَ", "نَكَصَ", "بَدَأَ", "كَذَبَ", "فَرَضَ", "نَزَلَ", "عَبَسَ", "سَلَفَ", "فَصَلَ", "مَنَعَ", "شَرَحَ", "ذَهَبَ", "تَرَكَ", "خَتَمَ", "جَعَلَ", "صَدَقَ", "سَأَلَ", "بَرَزَ", "كَسَبَ", "بَسَطَ", "أَكَلَ", "كَتَبَ", "حَكَمَ", "لَعَنَ", "شَرَعَ", "طَبَعَ", "وَقَعَ", "صَرَفَ", "ذَرَأَ", "سَكَتَ", "بَعَثَ", "وَجَدَ", "أَحَدَ", "نَبَذَ", "حَسَدَ", "دَخَلَ", "فَتَحَ", "فَغَفَرَ", "قَتَلَ", "مَرَجَ"];
// p26-29 - زير تمرين. Fatha + kasra mixed; kasra is the new mark (red).

   ENGINE
   ========================================================================== */
const $ = id => document.getElementById(id);
const COLORS = ['#eb8fd4','#a9e05f','#f3e14f','#d9dee4','#8fd0f5','#f7a85c','#c3a6f0','#7fdcc0'];
const HARAKAT = /[ً-ْٰ]/g;
const IS_MARK = /[ً-ْٰ]/;      // non-global: .test() on a /g regex is stateful
const bare = s => s.replace(HARAKAT, '');

// A practice mode is a different activity on the same book pages, so each one gets
// its own entry in the level list rather than hiding behind a second dropdown.
const MODE_NAME = { find: 'find the letters', form: 'pick the shape' };
const FLAT = LESSONS.flatMap(L => L.levels.flatMap(v => v.modes
  ? v.modes.map(m => ({ ...v, lesson: L, mode: m, base: v.id, howto: v.howto[m],
                        id: v.id + '-' + m, name: v.name + ' — ' + MODE_NAME[m] }))
  : [{ ...v, lesson: L, base: v.id }]));
const level = () => FLAT[$('level').selectedIndex];

let hits = 0, missed = 0, running = false, timer = null, bag = [], missLog = new Map();

/* ---------- teams: eight children round one panel, so a turn belongs to a side ---------- */
const TEAM_COLOURS = ['#eb5f8f', '#3fb0e0', '#7ec850', '#f0a93c'];
const TEAM_NAMES   = ['Team 1', 'Team 2', 'Team 3', 'Team 4'];
let teams = [], turn = 0;

function setupTeams() {
  const m = $('mode').value;
  const n = m === 'solo' ? 0 : +m.replace('teams', '');
  teams = Array.from({ length: n }, (_, i) => ({ name: TEAM_NAMES[i], colour: TEAM_COLOURS[i], score: 0 }));
  turn = 0;
  $('lWho').style.display = n ? 'none' : '';
  $('turn').hidden = !n;
  drawTeams();
}

function drawTeams() {
  $('teams').innerHTML = teams.map((t, i) =>
    `<div class="t${i === turn ? ' up' : ''}"><span class="dot" style="background:${t.colour}"></span>`
    + `${t.name} <span class="n">${t.score}</span></div>`).join('');
  if (teams.length) {
    $('turn').textContent = teams[turn].name + "'s turn";
    $('turn').style.background = teams[turn].colour;
  }
}

// Every item is one turn, whoever answers it and however it was judged.
function passTurn() {
  if (!teams.length) return;
  turn = (turn + 1) % teams.length;
  drawTeams();
}

/* ---------- letter forms, via ZWJ: the font shapes them, we hardcode nothing ---------- */
// ى is written as ي at the start and in the middle — alif maqsura only exists
// word-finally. That is exactly the row the book prints for it on p5, and the
// font's own shaper gives a DOTLESS tooth for U+0649, which would be wrong.
const asMedial = l => l === 'ى' ? 'ي' : l;
const FORM = { iso: l => l,
               init: l => asMedial(l) + ZWJ,
               med:  l => ZWJ + asMedial(l) + ZWJ,
               fin:  l => ZWJ + l };
const sameLetter = (a, b) => asMedial(a) === asMedial(b);
const POS  = [['init','at the start','شروع ما'], ['med','in the middle','درميان ما'],
              ['fin','at the end','اخر ما']];

/* ---------- red marks: the book prints the newly-taught harakat in red ---------- */
// The book colours the mark alone. A browser cannot: a combining mark is composed
// into the base letter's glyph and takes the BASE's colour, so a <span> around just
// the mark computes red and still paints black (verified). So colour the whole
// cluster - the letter that carries the new mark goes red with it.
function paint(word, mark) {
  if (!mark) return word;
  const out = [];
  for (const ch of word) {
    if (IS_MARK.test(ch) && out.length) out[out.length - 1] += ch;
    else out.push(ch);
  }
  return out.map(c => c.includes(mark) ? `<span class="red">${c}</span>` : c).join('');
}

/* ---------- حروف القطع: break a word where a qat' letter refuses to join left ---------- */
function qatGroups(word) {
  const out = []; let cur = '';
  for (const ch of word) { cur += ch; if (QAT.includes(ch)) { out.push(cur); cur = ''; } }
  if (cur) out.push(cur);
  return out;
}

/* ---------- scoring, shared by every exercise ---------- */
function score(ok, item) {
  if (ok) { hits++; blip(); if (teams.length) teams[turn].score++; }
  else { missed++; missLog.set(item, (missLog.get(item) || 0) + 1); }
  $('hits').textContent = hits; $('miss').textContent = missed;
  drawTeams();
  saveProgress();
  passTurn();
}

let ac;
function blip() {
  try {
    ac ||= new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.setValueAtTime(760, t); o.frequency.exponentialRampToValueAtTime(170, t + .12);
    g.gain.setValueAtTime(.22, t);      g.gain.exponentialRampToValueAtTime(.001, t + .15);
    o.start(t); o.stop(t + .16);
  } catch (e) { /* audio blocked - game still works */ }
}

/* ---------- deal the whole level before repeating anything ---------- */
function nextItem(list) {
  if (!bag.length) bag = shuffle(list.slice());
  return bag.pop();
}

/* ==========================================================================
   EXERCISE 1 - BALLOON   (p1, p20-35)
   ========================================================================== */
function spawn() {
  const lv = level(), item = nextItem(lv.items);
  const n = bare(item).replace(/\s/g, '').length;
  const ui = parseFloat(getComputedStyle(document.body).getPropertyValue('--ui')) || 1;
  const w = Math.min(innerWidth * 0.44, (n > 5 ? 260 : n > 3 ? 230 : n > 1 ? 195 : 155) * ui);
  const fs = n > 5 ? 0.20 : n > 3 ? 0.25 : n > 2 ? 0.31 : n > 1 ? 0.40 : 0.54;

  const rise = document.createElement('div');
  rise.className = 'rise';
  rise.style.left = (5 + Math.random() * 74) + '%';
  rise.style.animationDuration = $('rise').value + 's';
  rise.style.setProperty('--rise', $('rise').value + 's');

  const sway = document.createElement('div');
  sway.className = 'sway';
  sway.style.animationDuration = (2.8 + Math.random() * 1.6) + 's';

  const b = document.createElement('div');
  b.className = 'balloon';
  b.style.setProperty('--w', w + 'px');
  b.style.setProperty('--fs', fs);
  b.style.setProperty('--c', pick(COLORS));
  // p20/25/30 mark 8 letters with (*) — read مفخم (heavy)
  const heavy = lv.heavy && HEAVY.includes(bare(item)[0]);
  b.innerHTML = `<span class="item ar" lang="ar">${paint(item, lv.red)}</span>`
              + (heavy ? '<span class="heavy">جاڑو</span>' : '')
              + (lv.beats ? '<span class="beats"><i></i><i></i></span>' : '')
              + '<span class="string"></span>';

  b.addEventListener('click', () => {
    if (rise.dataset.done) return;
    rise.dataset.done = '1';
    score(true, item);
    b.classList.add('popped');
    setTimeout(() => rise.remove(), 200);
  });
  rise.addEventListener('animationend', e => {
    if (e.animationName !== 'rise' || rise.dataset.done) return;
    rise.dataset.done = '1';
    score(false, item);
    rise.remove();
  });
  sway.appendChild(b); rise.appendChild(sway); $('field').appendChild(rise);
}

function loop() { if (!running) return; spawn(); timer = setTimeout(loop, $('gap').value * 1000); }

/* ==========================================================================
   EXERCISE 2 - FORM MATCH   (p3-5)  self-scoring, no teacher needed
   ========================================================================== */
let formQ = null;
function askForm() {
  // Position questions only make sense for the 22 letters that join both ways -
  // for ا د ذ ر ز و the start form and the isolated form are the same glyph.
  const kind = pick(['whichLetter', 'whichForm', 'whichPos']);
  const letter = kind === 'whichLetter' ? pick(LETTERS) : pick(JOINING);
  const [p, en, ar] = pick(POS);
  let show, opts, right, q;

  if (kind === 'whichLetter') {
    show = FORM[p](letter);
    right = letter;
    opts = shuffle([letter, ...shuffle(LETTERS.filter(l => l !== letter)).slice(0, 3)]);
    q = 'Which letter is this?';
  } else if (kind === 'whichForm') {
    show = letter;
    right = FORM[p](letter);
    const others = POS.filter(x => x[0] !== p).map(x => FORM[x[0]](letter));
    opts = shuffle([right, ...others, FORM.iso(letter)].filter((v, i, a) => a.indexOf(v) === i));
    q = `How does it look ${en}? (${ar})`;
  } else {
    show = FORM[p](letter);
    right = en;
    opts = POS.map(x => x[1]);
    q = 'Where in the word does this shape sit?';
  }
  formQ = { right, item: kind === 'whichPos' ? FORM[p](letter) : letter + ' ' + en };
  $('fq').textContent = q;
  $('fshow').textContent = show;
  $('fopts').innerHTML = '';
  for (const o of opts) {
    const el = document.createElement('div');
    el.className = 'opt' + (kind === 'whichPos' ? ' lat' : ' ar');
    el.innerHTML = `<span class="gl">${o}</span>`;
    el.onclick = () => {
      if (el.classList.contains('good') || el.classList.contains('bad')) return;
      const good = o === formQ.right;
      el.classList.add(good ? 'good' : 'bad');
      score(good, formQ.item);
      if (good) setTimeout(askForm, 480);
    };
    $('fopts').appendChild(el);
  }
}

/* ==========================================================================
   EXERCISE 3 - JOIN   (p6-16)  mirrors the book's separate -> faded -> bold columns
   ========================================================================== */
let buildQ = null, joinMode = 'find';

// Which shape a letter takes at position i. It joins backwards only if the letter
// BEFORE it is a joining letter, and forwards only if IT is one. That single rule
// is what p3-5 and p17-18 teach between them.
function formAt(word, i) {
  const back = i > 0            && !QAT.includes(word[i - 1]);
  const fwd  = i < word.length - 1 && !QAT.includes(word[i]);
  return back && fwd ? FORM.med(word[i])
       : back        ? FORM.fin(word[i])
       : fwd         ? FORM.init(word[i])
       :               FORM.iso(word[i]);
}
// Only offer shapes that actually look different: a قطع letter has just two.
const formsOf = l => QAT.includes(l)
  ? [FORM.iso(l), FORM.fin(l)]
  : [FORM.iso(l), FORM.init(l), FORM.med(l), FORM.fin(l)];

function askJoin() {
  const lv = level();
  if (lv.base === '2b') {
    const [letter, atStart, atEnd] = pick(PAIRS);
    const w = pick([atStart, atEnd]);
    buildQ = { word: w, letter,
      label: `${letter} ${w === atStart ? 'شروع ما (at the start)' : 'اخر ما (at the end)'}` };
  } else {
    const row = pick(W3), i = 1 + (Math.random() * 3 | 0);
    buildQ = { word: row[i], letter: row[0],
      label: `${row[0]} ${['', 'شروع ما (start)', 'وسط ما (middle)', 'اخر ما (end)'][i]}` };
  }
  buildQ.letters = [...buildQ.word];
  buildQ.idx = 0;
  buildQ.usedKeys = new Set();
  makePool();
  drawJoin();
}

function makePool() {
  const L = buildQ.letters;
  if (joinMode === 'find') {
    // the word's own letters, plus decoys, shuffled - the child has to pick them out
    const decoys = shuffle(LETTERS.filter(l => !L.includes(l))).slice(0, L.length >= 3 ? 3 : 2);
    buildQ.pool = shuffle([...L, ...decoys]);
  } else if (joinMode === 'form') {
    // every shape each of the word's letters can take
    buildQ.pool = shuffle(L.flatMap(formsOf));
  }
}

const expected = () => joinMode === 'form'
  ? formAt(buildQ.word, buildQ.idx)
  : buildQ.letters[buildQ.idx];

// n letters revealed, with a ZWJ so the last one shows its JOINING shape: ب -> بـ
function partial(word, n) {
  if (n <= 0) return '';
  const s = word.slice(0, n);
  return n < word.length ? s + ZWJ : s;
}

function drawJoin() {
  const { word, letters, idx, letter, label, pool } = buildQ;
  const done = idx >= letters.length;
  const wholeRed = level().base === '2b';  // p6-10 reds the whole join, p11-16 one letter
  $('jsteps').onclick = null; $('jsteps').style.cursor = '';
  $('jactions').className = '';

  const finished = wholeRed
    ? `<span class="tx-ok">${word}</span>`
    : [...word].map(c => c === letter ? `<span class="tx-ok">${c}</span>` : c).join('');

  // What sits above the chips depends on the practice mode.
  let top;
  if (done) {
    top = `<div class="cell on"><div class="step shown">${finished}</div>`
        + '<div class="cap">joined</div></div>';
  } else if (joinMode === 'find') {
    top = `<div class="cell on"><div class="step shown">${word}</div><div class="cap">the word</div></div>`
        + (idx ? '<div class="arrow">\u2190</div><div class="cell on">'
                 + `<div class="step faded">${partial(word, idx)}</div>`
                 + '<div class="cap">picked so far</div></div>' : '');
  } else if (joinMode === 'form') {
    top = `<div class="cell on"><div class="step shown">${letters.join('\u2003')}</div>`
        + '<div class="cap">the letters</div></div>'
        + (idx ? '<div class="arrow">\u2190</div><div class="cell on">'
                 + `<div class="step faded">${partial(word, idx)}</div>`
                 + '<div class="cap">joined so far</div></div>' : '');
  }
  $('jsteps').innerHTML = top;

  $('jactions').innerHTML = '';
  if (done) {
    $('jhint').textContent = 'Now read the whole word aloud';
    const ok = document.createElement('button'); ok.textContent = 'Read it correctly';
    const no = document.createElement('button'); no.textContent = 'Missed it'; no.className = 'ghost';
    ok.onclick = () => { score(true, word); askJoin(); };
    no.onclick = () => { score(false, word); askJoin(); };
    $('jactions').classList.add('ltr');
    $('jactions').append(ok, no);
    return;
  }

  const want = expected();
  pool.forEach((ch, k) => {
    if (buildQ.usedKeys && buildQ.usedKeys.has(k)) return;   // a used chip leaves the pool
    const el = document.createElement('div');
    el.className = 'chip ar';
    el.innerHTML = `<span class="gl">${ch}</span>`;
    el.onclick = () => {
      if (ch !== want) {                     // wrong letter, or wrong shape, or out of order
        el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
        return;
      }
      buildQ.usedKeys = buildQ.usedKeys || new Set();
      buildQ.usedKeys.add(k);
      buildQ.idx++;
      drawJoin();
    };
    $('jactions').appendChild(el);
  });
}

/* ==========================================================================
   EXERCISE 4 - حروف القطع   (p17-18)
   ========================================================================== */
let spotQ = null;

function askSpot() {
  const lv = level();
  const word = nextItem(lv.items);
  const cl = clusters(word);
  const want = TARGET[lv.target](cl);
  if (!want.size) { askSpot(); return; }          // never show a word with no answer
  spotQ = { word, cl, want, done: false };
  $('jsteps').onclick = null; $('jsteps').style.cursor = '';
  $('jsteps').innerHTML = `<div class="cell on"><div class="step shown">${word}</div></div>`;
  $('jhint').textContent = '';
  $('jactions').innerHTML = '';
  cl.forEach((c, k) => {
    const el = document.createElement('div');
    el.className = 'chip ar';
    el.innerHTML = `<span class="gl">${c}</span>`;
    el.onclick = () => {
      if (spotQ.done) return;
      if (want.has(k)) { spotQ.done = true; el.classList.add('good'); score(true, word); revealSpot(k); }
      else { el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
             score(false, word); }
    };
    $('jactions').appendChild(el);
  });
}

function revealSpot(k) {
  const lv = level(), { word, cl, want } = spotQ;
  const green = cl.map((c, i) => want.has(i) ? `<span class="tx-ok">${c}</span>` : c).join('');
  if (lv.target === 'qat') {
    const groups = qatGroups(word);
    const mark = w => [...w].map(c => QAT.includes(c) ? `<span class="tx-ok">${c}</span>` : c).join('');
    $('jsteps').innerHTML =
        `<div class="cell on"><div class="step shown">${mark(word)}</div><div class="cap">the word</div></div>`
      + '<div class="arrow">\u2190</div>'
      + `<div class="cell on"><div class="step final">`
      + groups.map(g => `<span class="grp">${mark(g)}</span>`).join('')
      + `</div><div class="cap">${groups.length > 1 ? 'breaks into ' + groups.length : 'stays whole'}</div></div>`;
    $('jhint').innerHTML = groups.length > 1
      ? `<b class="ar tx-ok" style="font-size:calc(24px * var(--ui))">${cl[k]}</b> is a قطع letter — the word breaks right after it`
      : `<b class="ar tx-ok" style="font-size:calc(24px * var(--ui))">${cl[k]}</b> is a قطع letter, but it is last here, so the word stays whole`;
  } else {
    $('jsteps').innerHTML = `<div class="cell on"><div class="step shown">${green}</div></div>`;
    $('jhint').innerHTML = lv.reveal.replace('{}', `<b class="ar tx-ok" style="font-size:calc(24px * var(--ui))">${cl[k]}</b>`);
  }
  $('jactions').innerHTML = '<button id="jnext2">Next word \u2192</button>';
  $('jnext2').onclick = askSpot;
}

/* ==========================================================================
   EXERCISE 5 - PICK ONE   self-scoring: prompt, a few big options, one right
   ========================================================================== */
let pickQ = null;
function askPick() {
  const lv = level();
  const it = nextItem(lv.items);          // {show, answer, options}
  pickQ = it;
  $('fq').textContent = lv.prompt;
  $('fshow').textContent = it.show;
  $('fshow').style.display = it.show ? '' : 'none';   // 5a asks only about the options
  $('fopts').innerHTML = '';

    el.innerHTML = `<span class="gl">${o}</span>`;
    el.onclick = () => {
      if (el.classList.contains('good')) return;
      const good = o === it.answer;
      el.classList.add(good ? 'good' : 'bad');
      score(good, it.show);
      if (good) setTimeout(askPick, 480);
    };
    $('fopts').appendChild(el);
  }
}

const PANES = { balloon: 'pBalloon', form: 'pForm', pick: 'pForm', join: 'pJoin', spot: 'pJoin' };
function showPane(ex) {
  for (const id of new Set(Object.values(PANES))) $(id).classList.toggle('on', PANES[ex] === id);
  const isBalloon = ex === 'balloon';
  $('lRise').style.display = $('lGap').style.display = isBalloon ? '' : 'none';
  $('play').style.display = isBalloon ? '' : 'none';
}

function setRunning(on) {
  running = on;
  $('field').classList.toggle('paused', !on);
  $('play').textContent = on ? 'Pause' : ($('field').children.length ? 'Resume' : 'Start');
  clearTimeout(timer);
  if (on) { $('report').classList.remove('show'); loop(); } else showReport();
}

function reset() {
  const lv = level();
  running = false; clearTimeout(timer);
  $('field').innerHTML = ''; $('field').classList.remove('paused');
  bag = []; hits = 0; missed = 0;
  $('hits').textContent = 0; $('miss').textContent = 0;
  $('report').classList.remove('show');

  $('page').textContent = 'p' + lv.book;

  if (lv.gap)  { $('gap').value = lv.gap; $('gapV').textContent = (+lv.gap).toFixed(1) + 's'; }

  if (lv.ex === 'form') askForm();

}

const keyFor = () => 'qaidah:' + ($('who').value.trim().toLowerCase() || '_');
function saveProgress() {
  try {
    const all = JSON.parse(localStorage.getItem(keyFor()) || '{}');
    all[level().id] = { hits, missed, miss: [...missLog.entries()], at: Date.now() };
    localStorage.setItem(keyFor(), JSON.stringify(all));
  } catch (e) { /* private window - progress just won't persist */ }
}
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(keyFor()) || '{}'); } catch (e) { return {}; }
}

function showReport() {
  const all = loadProgress();
  const who = $('who').value.trim() || 'this device';
  let html = `<h2>${who} — missed items, and the page to reopen</h2>`;
  let any = false;
  for (const lv of FLAT) {
    const rec = all[lv.id];
    if (!rec || !rec.miss || !rec.miss.length) continue;
    any = true;
    const rows = rec.miss.sort((a, b) => b[1] - a[1]);
    html += `<h3>${lv.lesson.ar} · ${lv.ar} — book p${lv.book} `
          + `<span style="opacity:.6">(${rec.hits}✓ ${rec.missed}✗)</span></h3><ul>`
          + rows.map(([it, c]) => {
              const idx = LETTERS.indexOf(it);
              const nm = idx >= 0 ? NAMES[idx] + ' · ' : '';
              return `<li><span class="g ar">${it}</span><span class="n">${nm}${c}×</span></li>`;
            }).join('') + '</ul>';
  }
  $('report').innerHTML = any ? html
    : `<h2>${who}</h2><p class="empty">Nothing missed yet. ✓</p>`;
  $('report').classList.add('show');
}

  const carries = (w, letter) => { const c = cl(w); return [...TARGET.madd(c)].some(i => c[i] === letter); };
  ok(MADD_A.every(w => carries(w, 'ا')), 'every p38-46 word carries a madd ا');
  ok(MADD_Y.every(w => carries(w, 'ي')), 'every p48-52 word carries a madd ي');

  ok(FLAT.find(l => l.id === '4c').items.some(w => TARGET.madd(cl(w)).size > 1),

  ok(DAGGER_W.every(w => w.includes(DAGGER)), 'every p40-41 word carries the dagger alif ٰ');
  ok(MAQSURA.every(w => w.endsWith('ى' + DAGGER)), 'every p42-43 word ends in ىٰ');
  ok(WAW_AS_ALIF.length === 6 && WAW_AS_ALIF.every(w => w.includes('و' + DAGGER)),

     'every p55 word ends in the unpronounced وا (the waw may carry a sukoon: عَتَوْا)');
  ok(SILAH_Y.every(w => w.includes(SUP_YA)) && SILAH_W.every(w => w.includes(SUP_WAW)),
     'p53 words carry ۦ and p60-61 words carry ۥ');

  // every spot activity must offer a findable answer on every single item

    ok(lv.items.every(w => TARGET[lv.target](clusters(w)).size > 0),
       `${lv.id}: every item has a tappable answer`);
  }
  ok(FLAT.filter(l => l.ex === 'spot').every(l => l.target && (l.reveal || l.target === 'qat')),
     'every spot activity names its target and explains the answer');
  ok(clusters('كِتَٰبُ').join('|') === 'كِ|تَٰ|بُ', 'clusters keep each letter with its own marks');
  ok(TARGET.madd(clusters('سَبِيلِ')).has(2), 'the madd in سَبِيلِ is the ي');
  ok(!TARGET.madd(clusters('كَتَبَ')).size, 'a word with no madd offers no madd answer');

  // --- Lesson 5: قلقلة and leen are both computable, so the words can be checked
  const L5 = FLAT.filter(l => l.lesson.n === 5);
  ok(L5.length === 8, `lesson 5 has 8 activities (got ${L5.length})`);
  ok(QALQ.join('') === 'قطبجد', 'the قلقلة letters are قطب جد (p71)');
  ok(QALQ_W.every(w => TARGET.qalq(clusters(w)).size),
     'every p71-73 word really contains a bouncing letter');
  ok(QALQ_W.every(w => [...TARGET.qalq(clusters(w))]
       .every(i => QALQ.includes(clusters(w)[i][0]) && clusters(w)[i].includes(SK))),
     'the bounce found is a قطب جد letter carrying a sukoon, not just any sukoon');
  ok(!TARGET.qalq(clusters('نَعْبُدُ')).size,
     'نَعْبُدُ has a sukoon but on ع, so nothing bounces');
  ok(LEEN_W.every(w => TARGET.leen(clusters(w)).size), 'every p77-78 word contains a leen');
  ok(TARGET.leen(clusters('يَوْمَ')).size === 1 && TARGET.leen(clusters('كَيْفَ')).size === 1,
     'يَوْمَ and كَيْفَ each have exactly one leen');
  ok(!TARGET.leen(clusters('قُلْ')).size, 'a sukoon on ل is not a leen');
  ok(SYL_SK.every(w => w.endsWith(SK)), 'every p63-65 syllable ends in a sukoon');
  ok(SK2.every(w => clusters(w).length === 2), 'p66-67 items are two letters');
  ok(MEEM_SK.every(w => w.includes('م' + SK)), 'every p74 item carries a sakin meem');
  ok(NOON_W.every(w => w.includes('ن' + SK)), 'every p75-76 item carries a sakin noon');
  const a5 = FLAT.find(l => l.id === '5a');
  ok(a5.items.every(it => it.options.filter(o => QALQ.includes(o)).length === 1),
     '5a: exactly one option bounces');
  ok(a5.items.every(it => it.options.includes(it.answer) && QALQ.includes(it.answer)),
     '5a: the answer is present and is a قلقلة letter');

  // --- Lesson 6: tanween is a noon you say and never write, so the اداء column is
  // generated from the rule rather than transcribed - and can be checked against it.
  const L6 = FLAT.filter(l => l.lesson.n === 6);
  ok(L6.length === 4, `lesson 6 has 4 activities (got ${L6.length})`);
  ok(TANWEEN.map(t => t.rows.length).join(',') === '25,23,25',
     'the book tables are 25 / 23 / 25 rows (p80-82, 84-86, 87-89)');
  ok(TANWEEN.every(t => t.rows.every(([, w]) => w.includes(t.mark))),
     'every example word carries the tanween its table teaches');
  ok(TANWEEN.every(t => t.rows.every(([, w]) =>
       [FN, KN, DN].filter(m => w.includes(m)).length === 1)),
     'no example word carries two different tanween marks');
  ok(TANWEEN.every(t => t.rows.every(([l, w]) =>
       [...(l === 'ء' ? 'ءأإؤئ' : l)].some(c => w.includes(c + t.mark)))),
     'the row letter is the one carrying the tanween (hamza may sit on a carrier)');
  ok(tanweenForm('ب', FN) === 'ب' + FN + 'ا' && tanweenForm('ب', KN) === 'ب' + KN,
     'fathatain is written with an alif, kasratain is not (p80 vs p84)');
  ok(tanweenSound('ب', F) === 'ب' + F + 'ن' + SK, 'ـبًا sounds like بَنْ (the اداء column)');
  const a6 = FLAT.find(l => l.id === '6a');
  ok(a6.items.length === 73, `6a covers all 73 table rows (got ${a6.items.length})`);
  ok(a6.items.every(it => it.options.length === 3 && it.options.includes(it.answer)),
     '6a offers all three noon sounds and includes the right one');
  ok(a6.items.every(it => it.answer.endsWith('ن' + SK)), '6a answers all end in a sakin noon');
  const b6 = FLAT.find(l => l.id === '6b');
  ok(b6.items.every(it => ['do-zabar','do-zer','do-pesh'].includes(it.answer)),
     '6b answers name one of the three tanween');
  ok(TN_WORDS.every(w => TARGET.tanween(clusters(w)).size),
     'every tanween word has a tappable tanween');
  ok(!TARGET.tanween(clusters('كَتَبَ')).size, 'a word with no tanween offers no answer');
  ok(MAQSURA_TN.every(w => w.includes(FN) && w.endsWith('ى')),
     'p83: tanween-fatha on an alif maqsura, written ى');
  // Word sets are as long as the book's page is - the leen list is 14 words, not 28.
  // What matters is that a set exists and is long enough not to repeat immediately.
  ok(FLAT.filter(l => l.ex === 'balloon').every(l => l.items && l.items.length >= 12),
     'every balloon level has a workable set of items');
  ok(FLAT.filter(l => ['spot','balloon'].includes(l.ex)).every(l => l.items.every(w => w.trim())),
     'no blank items anywhere');
  ok(FLAT.every(l => !l.items || new Set(l.items).size === l.items.length),
     'no duplicates inside a level');
  ok(qatGroups('يوم').join('|') === 'يو|م', 'يوم breaks as يو + م — waw joins ya, not meem (p18)');
  ok(qatGroups('كان').join('|') === 'كا|ن', 'كان breaks as كا + ن (p17)');
  ok(qatGroups('بيت').length === 1, 'بيت has no قطع letter, so it does not break');

  // formAt is the heart of the "pick the right shape" mode - get it wrong and the
  // game teaches the wrong shape with total confidence.
  const shapes = w => [...w].map((_, i) => formAt(w, i));
  ok(shapes('فعل').join('|') === ['ف'+ZWJ, ZWJ+'ع'+ZWJ, ZWJ+'ل'].join('|'),
     'فعل -> فـ / ـعـ / ـل  (initial, medial, final)');
  ok(shapes('يوم').join('|') === ['ي'+ZWJ, ZWJ+'و', 'م'].join('|'),
     'يوم -> يـ / ـو / م  — و is قطع, so م stands alone (p18)');
  ok(shapes('زاد').join('|') === ['ز', 'ا', 'د'].join('|'),
     'زاد -> three isolated shapes, every letter is قطع (p18)');
  ok(shapes('بت').join('|') === ['ب'+ZWJ, ZWJ+'ت'].join('|'), 'بت -> بـ / ـت');
  ok(formsOf('ب').length === 4 && formsOf('د').length === 2,
     'a joining letter offers 4 shapes, a قطع letter only 2 that differ');
  ok([...'بصل'].every((_, i) => partial('بصل', i + 1).startsWith('بصل'.slice(0, i + 1))),
     'partial() grows the word one letter at a time');
  ok(FORM.med('ب') === ZWJ + 'ب' + ZWJ && FORM.fin('ب') === ZWJ + 'ب', 'ZWJ builds the forms');
  ok(FORM.init('ى') === 'ي' + ZWJ && FORM.fin('ى') === ZWJ + 'ى',
     'ى shows as ي at the start but stays ى at the end (p5)');
  // ا د ذ ر ز و render the same isolated as initial, so a "where does this shape
  // sit?" question about them has two right answers. askForm() must never pick one.
  ok(QAT.every(l => !JOINING.includes(l)),
     'the 6 قطع letters are excluded from position questions (their shapes are ambiguous)');
  ok(paint('بَ', F).includes('class="red"'), 'the taught mark is painted red');
  ok(paint('بَ', null) === 'بَ', 'no red when the level has no new mark');

  const t = $('tests');
  t.innerHTML = `<h2 class="${bad?'fail':'pass'}">${bad?bad+' FAILED':'ALL PASSED'} — ${out.length} checks</h2><br>`
              + out.join('');
  t.classList.add('show');
}
if (location.hash === '#test') runSelfTest();
</script>
</body>
</html>
